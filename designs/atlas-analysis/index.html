.scout-axis-chart { grid-template-rows: 34px auto; grid-template-columns: auto minmax(0px, 1fr); column-gap: 6px; width: 100%; display: grid; }
.scout-axis-y { color: var(--label); font-variant-numeric: tabular-nums; flex-direction: column; justify-content: space-between; align-items: flex-end; font-size: 12px; font-weight: 500; line-height: 1; display: flex; }
.scout-axis-plot { align-items: stretch; min-width: 0px; display: flex; }
.scout-intel-panel[data-ui] .scout-axis-plot { border-left: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); }
.scout-axis-plot .scout-sparkline { height: 100%; }
.scout-axis-x { color: var(--label); grid-column: 2; justify-content: space-between; padding-top: 2px; font-size: 12px; display: flex; }
.scout-columns { align-items: flex-end; gap: 2px; width: 100%; height: 100%; padding: 0px 2px; display: flex; }
.scout-columns i { background: var(--muted); opacity: 0.8; border-radius: 2px 2px 0px 0px; flex: 1 1 0%; min-width: 0px; }
.scout-engine-panel { width: 100%; }
.scout-sparkline { width: 100%; height: 26px; color: var(--accent); display: block; }
.scout-sparkline polyline { vector-effect: non-scaling-stroke; }
.line-title { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; min-height: 2.8em; margin: 0px; font-size: 14px; font-weight: 500; line-height: 1.4; }
.scout-side .scout-miniboard-wrap { aspect-ratio: 1 / 1; align-self: center; width: 100%; max-width: 320px; height: auto; }
.scout-side .scout-miniboard { aspect-ratio: 1 / 1; width: 100%; height: auto; }
.scout-line-status { font-size: var(--fs-s); font-weight: 500; }
.scout-line-status.good { color: var(--good-text); }
.scout-line-status.warn { color: var(--warn-text); }
.scout-line-status.bad { color: var(--danger); }
.scout-side .note { margin: 0px; }
.scout-line-reason, .scout-line-reply { max-width: 60ch; color: var(--text); border: 0px; font-size: 16px; line-height: 1.45; }
.scout-side .note.good { background: var(--good-soft); color: var(--good-text); border-color: rgba(0, 0, 0, 0); }
.scout-side .note.warn { background: var(--warn-soft); color: var(--warn-text); border-color: rgba(0, 0, 0, 0); }
.scout-side .note.eng { background: var(--surface-3); color: var(--text); border-color: rgba(0, 0, 0, 0); }
.scout-side .actions { flex-wrap: wrap; gap: 6px; margin-top: 0px; display: flex; }
.subvars { flex-direction: column; gap: 4px; padding-top: 8px; display: flex; }
.scout-sublines { flex-direction: column; gap: 4px; display: flex; }
.sv { font-size: var(--fs-s); grid-template-columns: minmax(0px, 1fr) 60px 34px; align-items: center; gap: 6px; display: grid; }
.sv span { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; font-size: 13px; }
.sv i { background: var(--accent); border-radius: 3px; height: 5px; display: block; }
.sv b { text-align: right; }
.sv.muted { opacity: 0.5; }
.scout-source-warnings { border: 1px solid var(--warn); background: var(--warn-soft); color: var(--warn-text); font-size: var(--fs-s); border-radius: 8px; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0px 0px 10px; padding: 8px 10px; display: flex; }
.scout-source-warnings .source-warn-text { flex: 1 1 220px; margin: 0px; }
.scout-source-warnings .source-chips { flex-wrap: wrap; gap: 6px; display: flex; }
.scout-source-warnings .source-chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: var(--fs-s); white-space: nowrap; border-radius: 999px; padding: 2px 8px; }
.scout-source-warnings .source-chip.is-ok { border-color: var(--good); color: var(--good-text); background: var(--good-soft); }
.scout-source-warnings .source-chip.is-failed { border-color: var(--danger); color: var(--danger-strong); background: var(--danger-soft); }
.scout-source-warnings .source-chip.is-empty { opacity: 0.75; }
.scout-source-warnings .btn { margin-left: auto; }
@container scout-main (width <= 800px) {
  .line-row { grid-template-columns: minmax(0px, 1fr) 70px 72px 40px; }
  .line-row .lr-meta { flex-flow: wrap; grid-area: 2 / 1; align-items: center; gap: 6px; }
  .scout-lines-head { grid-template-columns: minmax(0px, 1fr) 70px 72px 40px; }
  .scout-lines-head span:nth-child(2) { display: none; }
}
@media (width <= 760px) and (orientation: portrait), (width <= 760px) and (height >= 521px) {
  .color-sec { flex-direction: column; display: flex; }
  .cs-head { order: 0; }
  .plan { order: 1; }
  .intel { order: 2; }
  .intel .headline { min-height: 4.2em; }
  .scout-panel .prof-id, .scout-panel .scout-color-rec { display: none; }
  .scout-panel .scout-profile { flex-flow: wrap; align-items: center; gap: 8px; padding: 10px 14px; }
  .scout-panel .prof-row { flex: 1 1 100%; grid-template-columns: repeat(2, minmax(0px, 1fr)); gap: 8px; display: grid; }
  .scout-panel .prof-row > .speed-chips { scrollbar-width: none; flex-wrap: nowrap; grid-column: 1 / -1; overflow-x: auto; }
  .scout-panel .prof-row .spacer { display: none; }
  .scout-color-tabs { grid-template-columns: repeat(2, minmax(0px, 1fr)); display: grid; }
  .scout-color-tab { text-align: center; flex-wrap: wrap; justify-content: center; row-gap: 0px; min-width: 0px; min-height: 36px; }
  .scout-color-tab small { flex-basis: 100%; }
  .speed { border-radius: 22px; min-height: 36px; padding: 0px 12px; }
  .scout-intel-charts, .first-moves { grid-template-columns: 1fr; }
  .line-row { grid-template-columns: 1fr auto; min-height: 36px; }
  .scout-lines-head { grid-template-columns: 1fr auto; }
  .scout-lines-head span:nth-child(2), .scout-lines-head span:nth-child(4), .scout-lines-head span:nth-child(5), .line-row .lr-wdl, .line-row .lr-meta, .line-row .lr-flags { display: none; }
  .line-row .lr-score, .scout-lines-head > :nth-child(3) { text-align: right; }
  .cs-head { grid-template-columns: minmax(0px, 1fr) auto auto; align-items: center; gap: 8px 10px; padding: 12px 14px; display: grid; }
  .cs-head .spacer, .cs-head .cs-with { display: none; }
  .cs-head .scout-section-who { text-overflow: ellipsis; white-space: nowrap; min-width: 0px; overflow: hidden; }
  .cs-head .scout-trending { grid-column: 1 / -1; justify-self: start; }
  .cs-head .cov { grid-column: 1; align-items: center; gap: 8px; min-width: 0px; min-height: 36px; display: flex; }
  .cs-head .cov:last-child { grid-column: 1 / -1; }
  .cs-head .scout-coverage-bar { flex: 0 0 auto; width: 28px; }
  .cs-head .scout-coverage-label { display: none; }
  .cs-head .scout-coverage-short { text-overflow: ellipsis; min-width: 0px; display: inline; overflow: hidden; }
  .cs-head .scout-prepare-all { white-space: nowrap; grid-column: 2 / -1; justify-self: end; }
  .scout-engine-progress { height: 0px; min-height: 0px; margin-block: -12px; overflow: visible; }
  .scout-add-icon { width: 36px; height: 36px; font-size: 16px; }
  .scout-side .actions .btn { min-height: 36px; }
  .prof-row .btn { min-height: 40px; }
  .scout-source-warnings .btn { width: 100%; min-height: 36px; margin-left: 0px; }
  .fm { min-height: 36px; }
}
.cov[hidden] { display: none; }
@keyframes scout-row-enter { 
  0% { opacity: 0; transform: translateY(4px); }
  100% { opacity: 1; transform: none; }
}
.scout-weakness-row.is-enter { animation-duration: ; animation-timing-function: ; animation-iteration-count: ; animation-direction: ; animation-fill-mode: ; animation-play-state: ; animation-name: ; animation-timeline: ; animation-range-start: ; animation-range-end: ; animation-delay: calc(min(var(--enter-index,0), 11) * 35ms); }
.scout-engine-progress.is-idle:empty { display: none; }
