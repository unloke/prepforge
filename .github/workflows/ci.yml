name: CI

# Gate every push/PR on the same checks the deploy preflight runs locally:
# Python (pytest + ruff + alembic drift) and JS (vitest + Vite build). Green CI is
# a launch requirement (ROADMAP Phase 6 / Phase 3e guardrails).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install (server + dev extras)
        run: uv sync --extra server --extra dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest
        run: uv run pytest -q
      - name: Alembic upgrade + drift check
        # `alembic check` diffs the metadata against a migrated DB, so apply
        # migrations to a throwaway SQLite first; then assert zero drift.
        env:
          DATABASE_URL: sqlite:///ci_alembic.sqlite3
        run: |
          uv run alembic upgrade head
          uv run alembic check

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: migtest
          POSTGRES_PASSWORD: migtest-only
          POSTGRES_DB: prepforge_migtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migtest -d prepforge_migtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install (server + dev extras)
        run: uv sync --extra server --extra dev
      - name: Alembic upgrade head + drift check on PostgreSQL
        # The d4e5f6a7b8c9 backfill passed SQLite CI while failing on PostgreSQL
        # (integer literal into a boolean column). This job runs the same
        # upgrade/check against a real PostgreSQL service so dialect-specific
        # SQL in migrations cannot pass CI again.
        env:
          DATABASE_URL: postgresql://migtest:migtest-only@localhost:5432/prepforge_migtest
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Migration regression tests on PostgreSQL
        env:
          DATABASE_URL: postgresql://migtest:migtest-only@localhost:5432/prepforge_migtest
          TEST_POSTGRES_URL: postgresql://migtest:migtest-only@localhost:5432/prepforge_migtest
        run: uv run pytest -q tests/test_migration_lichess_primary.py tests/test_api_lichess.py tests/test_api_lichess_games.py

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint:js -- --quiet
      - name: Vitest
        run: npm test -- --run
      - name: Build SPA
        run: npm run build
      - name: Bundle-size gate
        run: node scripts/check-bundle-size.mjs

  stockfish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install JS + Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Package layout + metadata sync
        run: npx vitest run scripts/sync-stockfish.test.js
      - name: Stockfish provider + Analyze + Build generation tests
        run: >-
          npx vitest run
          web-src/engine/stockfish-provider.test.js
          web-src/engine/game-analyzer.test.js
          web-src/engine/build-generator.test.js
          web-src/engine/build-generate-runner.test.js
      - name: Build SPA + bundle gate
        run: |
          npm run build
          node scripts/check-bundle-size.mjs
      - name: Browser Stockfish UCI smoke
        run: npm run smoke:stockfish

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install (server + dev extras)
        run: uv sync --extra server --extra dev
      - name: Install JS + Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build SPA (E2E)
        env:
          VITE_ENABLE_SCOUT_E2E: "1"
        run: npm run build
      - name: Scout + axe E2E
        run: >-
          uv run pytest -m e2e
          tests/e2e/test_scout_smoke.py
          tests/e2e/test_axe_baseline.py
          -q
