name: keep-warm

# Stability plan #2: ping /healthz on a schedule so the Render free tier doesn't
# spin down. A cold start makes a new visitor's first load a 30–60s spinner — bad
# first impression in the word-of-mouth phase. This is a secondary warmer; the
# primary should be an external monitor (e.g. UptimeRobot) that also alerts.
#
# Notes / caveats:
# * GitHub cron is best-effort and often delayed several minutes under load, and
#   scheduled workflows are auto-disabled after 60 days with no repo activity — so
#   don't rely on this alone as uptime monitoring.
# * Set the repo variable PROD_HEALTHZ_URL (Settings → Secrets and variables →
#   Actions → Variables) to override the default below per environment.
# * This touches no app code; it only curls a public liveness endpoint.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        env:
          HEALTHZ_URL: ${{ vars.PROD_HEALTHZ_URL || 'https://prepforge-w0c5.onrender.com/healthz' }}
        run: |
          echo "Pinging $HEALTHZ_URL"
          code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 60 --retry 2 "$HEALTHZ_URL")
          echo "HTTP $code"
          test "$code" = "200"
