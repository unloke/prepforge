<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coach review · PrepForge</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1116;
        --bg-2: #161b22;
        --bg-3: #1c2230;
        --line: #283041;
        --line-2: #344056;
        --fg: #e8ebf0;
        --fg-dim: #99a2b3;
        --fg-faint: #6b7486;
        --accent: #5b8cff;
        --good: #4ad07d;
        --warn: #f0bc5e;
        --danger: #ff6b6b;
        --brilliant: #34d8c8;
        --info: #9aa6bd;
        --radius: 14px;
        --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .25);
      }
      * { box-sizing: border-box; }
      body {
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
        margin: 0; padding: 0 1.25rem 4rem;
        background: radial-gradient(1200px 600px at 80% -10%, #18203033, transparent), var(--bg);
        color: var(--fg);
      }
      .cr-wrap { max-width: 60rem; margin: 0 auto; }
      header.cr-top { padding: 2rem 0 1rem; }
      h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 .35rem; letter-spacing: -.01em; }
      .cr-sub { color: var(--fg-dim); margin: 0; max-width: 46rem; }

      /* ---- controls ---- */
      .cr-panel {
        background: linear-gradient(180deg, var(--bg-2), #131820);
        border: 1px solid var(--line); border-radius: var(--radius);
        padding: 1.1rem 1.25rem; box-shadow: var(--shadow); margin-top: 1.25rem;
      }
      .cr-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .9rem; }
      @media (max-width: 640px) { .cr-grid { grid-template-columns: repeat(2, 1fr); } }
      label { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-faint); margin-bottom: .3rem; }
      input[type="text"], input[type="number"], textarea {
        width: 100%; background: var(--bg); color: var(--fg);
        border: 1px solid var(--line-2); border-radius: 9px; padding: .55rem .65rem; font: inherit;
        transition: border-color .15s, box-shadow .15s;
      }
      input:focus, textarea:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px #5b8cff33; }
      .cr-checks { display: flex; gap: 1.25rem; align-items: center; margin-top: 1rem; flex-wrap: wrap; }
      .cr-checks label {
        display: inline-flex; gap: .45rem; align-items: center; color: var(--fg-dim);
        margin: 0; font-size: .88rem; text-transform: none; letter-spacing: 0; cursor: pointer;
      }
      .cr-checks input { accent-color: var(--accent); width: 1rem; height: 1rem; }
      button {
        background: var(--accent); color: #fff; border: 0; border-radius: 9px;
        padding: .6rem 1.5rem; font: inherit; font-weight: 600; cursor: pointer; transition: filter .15s, transform .05s;
      }
      button:hover:not(:disabled) { filter: brightness(1.08); }
      button:active:not(:disabled) { transform: translateY(1px); }
      button:disabled { opacity: .5; cursor: default; }
      button.cr-secondary { background: var(--bg-3); color: var(--fg); font-weight: 500; border: 1px solid var(--line-2); }
      .cr-start-row { margin-top: 1.1rem; display: flex; gap: 1rem; align-items: center; }
      textarea { margin-top: 1rem; min-height: 4.5rem; resize: vertical; }

      /* ---- status / progress (sticky summary) ---- */
      .cr-statusbar {
        position: sticky; top: 0; z-index: 5; margin: 1.1rem 0 .25rem;
        background: #0e1116ee; backdrop-filter: blur(8px);
        border: 1px solid var(--line); border-radius: 11px; padding: .65rem .9rem;
      }
      #cr-env { white-space: pre-wrap; font: 12.5px/1.5 ui-monospace, "SF Mono", monospace; color: var(--fg-dim); margin: 0; }
      #cr-status { color: var(--danger); font-weight: 600; min-height: 0; }
      #cr-status:not(:empty) { margin: .75rem 0; }
      .cr-track { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin: .6rem 0 0; }
      #cr-bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--brilliant)); transition: width .25s; }
      #cr-log { white-space: pre-wrap; font: 12px/1.5 ui-monospace, monospace; color: var(--fg-faint); margin: .5rem 0; }
      #cr-export { margin: .75rem 0 1.25rem; }

      /* ---- cards ---- */
      #cr-cards { display: flex; flex-direction: column; gap: 1rem; }
      .cr-card {
        display: grid; grid-template-columns: 184px 1fr; gap: 1.25rem;
        background: var(--bg-2); border: 1px solid var(--line);
        border-left: 4px solid var(--line-2); border-radius: var(--radius);
        padding: 1rem; box-shadow: var(--shadow);
      }
      .cr-card.cr-tone-good { border-left-color: var(--good); }
      .cr-card.cr-tone-warn { border-left-color: var(--warn); }
      .cr-card.cr-tone-danger { border-left-color: var(--danger); }
      .cr-card.cr-tone-brilliant { border-left-color: var(--brilliant); }
      .cr-card.cr-tone-info { border-left-color: var(--info); }
      @media (max-width: 640px) { .cr-card { grid-template-columns: 1fr; } }

      .cr-board-wrap { position: relative; width: 184px; }
      .cr-board {
        width: 184px; height: 184px; display: grid;
        grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
        border-radius: 8px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.4);
      }
      .cr-sq { display: flex; align-items: center; justify-content: center; font-size: 22px; line-height: 1; }
      .cr-light { background: #e9edcc; color: #2a2a2a; }
      .cr-dark { background: #6f8a52; color: #14180e; }
      .cr-hl { box-shadow: inset 0 0 0 3px #f7c948; }
      .cr-ply {
        position: absolute; top: 6px; left: 6px; font: 600 11px ui-monospace, monospace;
        color: #fff; background: #0008; padding: .1rem .4rem; border-radius: 6px;
      }

      .cr-body { display: flex; flex-direction: column; min-width: 0; }
      .cr-head { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .6rem; }
      .cr-badge {
        font-size: .72rem; font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
        padding: .2rem .55rem; border-radius: 999px; border: 1px solid transparent; white-space: nowrap;
      }
      .cr-badge-good { color: var(--good); background: #4ad07d1f; border-color: #4ad07d44; }
      .cr-badge-warn { color: var(--warn); background: #f0bc5e1f; border-color: #f0bc5e44; }
      .cr-badge-danger { color: var(--danger); background: #ff6b6b1f; border-color: #ff6b6b44; }
      .cr-badge-brilliant { color: var(--brilliant); background: #34d8c81f; border-color: #34d8c844; }
      .cr-badge-info { color: var(--info); background: #9aa6bd1f; border-color: #9aa6bd44; }
      .cr-move { font: 600 .95rem ui-monospace, monospace; color: var(--fg); }
      .cr-players { color: var(--fg-faint); font-size: .8rem; margin-left: auto; }

      .cr-prose { font-size: 1.1rem; line-height: 1.5; color: var(--good); margin-bottom: .9rem; }
      .cr-prose.cr-warn { color: var(--warn); }
      .cr-prose.cr-danger { color: var(--danger); }
      .cr-prose.cr-brilliant { color: var(--brilliant); }
      .cr-prose.cr-info { color: var(--info); }

      .cr-actions { display: flex; gap: .55rem; align-items: center; margin-top: auto; }
      .cr-actions button { padding: .45rem 1rem; font-size: .9rem; }
      .cr-ok { background: #20603a; color: #d6f5e0; border: 1px solid #2e8a52; }
      .cr-bad { background: var(--bg-3); color: var(--fg-dim); border: 1px solid var(--line-2); }
      .cr-ok.cr-on { background: var(--good); color: #06210f; box-shadow: 0 0 0 2px #4ad07d66; }
      .cr-bad.cr-on { background: var(--danger); color: #2a0707; border-color: var(--danger); box-shadow: 0 0 0 2px #ff6b6b66; }
      .cr-note { flex: 1; min-width: 8rem; }
    </style>
  </head>
  <body>
    <div class="cr-wrap">
      <header class="cr-top">
        <h1>Coach review</h1>
        <p class="cr-sub">
          跑你的最近 Lichess 棋局，逐一顯示「局面 + coach 真實輸出」。按 ✓ / ✗ 評價、留下註記，
          匯出時會直接寫回 <code>coach-review-ratings.json</code>（dev server）。
        </p>
      </header>

      <div class="cr-panel">
        <div class="cr-grid">
          <div><label for="cr-user">Lichess 帳號</label><input id="cr-user" type="text" value="anonymousub" /></div>
          <div><label for="cr-games">棋局數</label><input id="cr-games" type="number" value="6" min="1" /></div>
          <div><label for="cr-depth">Stockfish 深度</label><input id="cr-depth" type="number" value="16" min="6" /></div>
          <div><label for="cr-rating">Maia 評級</label><input id="cr-rating" type="number" value="1500" min="1100" /></div>
        </div>
        <div class="cr-checks">
          <label><input id="cr-only-mine" type="checkbox" /> 只看我的走子</label>
          <label><input id="cr-skip-good" type="checkbox" /> 跳過 best / good / forced</label>
          <label><input id="cr-use-maia" type="checkbox" checked /> 啟用 Maia (intuition + brilliant)</label>
        </div>
        <div class="cr-start-row">
          <button id="cr-start">開始分析</button>
          <button id="cr-export" class="cr-secondary">匯出評價 → coach-review-ratings.json</button>
        </div>
        <textarea id="cr-pgn" placeholder="（選填）若 Lichess 抓不到，貼上 PGN（可多局）覆蓋帳號抓取"></textarea>
      </div>

      <div class="cr-statusbar">
        <div id="cr-status"></div>
        <div id="cr-env"></div>
        <div class="cr-track"><div id="cr-bar"></div></div>
      </div>
      <div id="cr-log"></div>

      <div id="cr-cards"></div>
    </div>

    <script type="module">
      import { mountCoachReview } from "./engine/coach-review-harness.js";
      mountCoachReview(document);
    </script>
  </body>
</html>
